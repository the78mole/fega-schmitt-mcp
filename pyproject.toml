[project]
name = "fega-schmitt-mcp"
version = "0.1.0"
description = "MCP server for FEGA & Schmitt Elektrogroßhandel price/availability data"
authors = [
    { name = "Daniel Glaser", email = "me@the78mole.de" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp[cli]>=1.0,<2.0",
    "fega-schmitt-client>=0.0.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "anyio[trio]>=4.0",
]

[project.scripts]
fega-schmitt-mcp = "fega_schmitt_mcp.server:main"

[project.urls]
Homepage = "https://github.com/the78mole/fega-schmitt-mcp"
Repository = "https://github.com/the78mole/fega-schmitt-mcp"
Issues = "https://github.com/the78mole/fega-schmitt-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fega_schmitt_mcp"]

# Override fega-schmitt-client to use local development version
[tool.uv.sources]
fega-schmitt-client = { path = "/home/daniel/GIT/Python/fega-schmitt-client", editable = true }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=fega_schmitt_mcp --cov-report=term-missing"
